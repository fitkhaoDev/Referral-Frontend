<div class="field" [class.field--invalid]="showError()">
  <label [for]="id" class="field__label">
    {{ label() }}
    @if (requiredMark()) {
      <span class="field__req" aria-hidden="true">*</span>
    }
  </label>

  <div class="field__control">
    <input
      [id]="id"
      [type]="effectiveType()"
      [formControl]="control()"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="inputmode() || null"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-invalid]="showError() || null"
      [attr.aria-describedby]="describedBy()"
    />
    @if (type() === 'password') {
      <button
        type="button"
        class="field__toggle"
        [attr.aria-label]="reveal() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="reveal()"
        (click)="toggleReveal()"
      >
        {{ reveal() ? 'Hide' : 'Show' }}
      </button>
    }
  </div>

  @if (hint() && !showError()) {
    <p class="field__hint" [id]="id + '-hint'">{{ hint() }}</p>
  }
  @if (showError()) {
    <p class="field__error" [id]="id + '-error'" role="alert">{{ errorText() }}</p>
  }
</div>
