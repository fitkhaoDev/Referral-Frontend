<header class="ph">
  <div class="ph__text">
    <h1 class="ph__title">
      {{ title() }}
      @if (count() != null) {
        <span class="ph__count fk-num">{{ count() }}</span>
      }
    </h1>
    @if (subtitle()) {
      <p class="ph__subtitle">{{ subtitle() }}</p>
    }
  </div>
  <div class="ph__actions">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
