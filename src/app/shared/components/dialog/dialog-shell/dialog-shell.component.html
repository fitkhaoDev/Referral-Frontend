<div class="dlg" role="dialog" aria-modal="true" [attr.aria-label]="title()">
  <header class="dlg__head">
    <div class="dlg__titles">
      <h2 class="dlg__title">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="dlg__subtitle">{{ subtitle() }}</p>
      }
    </div>
    <button type="button" class="dlg__close" [attr.aria-label]="closeLabel()" (click)="close()">
      &times;
    </button>
  </header>

  <div class="dlg__body">
    <ng-content></ng-content>
  </div>

  <footer class="dlg__footer">
    <ng-content select="[footer]"></ng-content>
  </footer>
</div>
