<app-auth-layout
  eyebrow="Partner portal"
  heading="Sign in to FitKhao"
  subheading="Track referrals, incentives, your wallet and withdrawals."
  tagline="Referral Partner Management"
>
  <!-- Role selector tabs -->
  <div class="role-tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="role-tab role-tab--active"
      aria-selected="true"
    >Partner</button>
    <button
      type="button"
      role="tab"
      class="role-tab"
      aria-selected="false"
      (click)="goToAdmin()"
    >Admin</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    @if (error(); as err) {
      <app-alert tone="error" title="Sign in failed">{{ err.message }}</app-alert>
    }

    <app-text-field
      [control]="form.controls.identifier"
      label="Email or Partner ID"
      autocomplete="username"
      placeholder="you@example.com or FK-IND-000123"
      requiredMark
    ></app-text-field>

    <app-text-field
      [control]="form.controls.password"
      label="Password"
      type="password"
      autocomplete="current-password"
      requiredMark
    ></app-text-field>

    <app-button type="submit" size="lg" block [loading]="busy()">Sign in</app-button>

    <p class="hint">First time? Use the temporary password from your FitKhao administrator.</p>
  </form>
</app-auth-layout>
