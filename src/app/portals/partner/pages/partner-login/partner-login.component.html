<app-auth-layout
  eyebrow="Partner portal"
  heading="Sign in to your FitKhao account"
  subheading="Track referrals, incentives, your wallet and withdrawals."
  tagline="Your referrals. Your earnings. In real time."
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    @if (error(); as err) {
      <app-alert tone="error" title="Sign in failed">{{ err.message }}</app-alert>
    }

    <app-text-field
      [control]="form.controls.identifier"
      label="Email or Partner ID"
      autocomplete="username"
      placeholder="you@example.com or FK-IND-000123"
      requiredMark
    ></app-text-field>

    <app-text-field
      [control]="form.controls.password"
      label="Password"
      type="password"
      autocomplete="current-password"
      requiredMark
    ></app-text-field>

    <app-button type="submit" size="lg" block [loading]="busy()">Sign in</app-button>

    <p class="hint">
      First time here? Use the temporary password from your FitKhao administrator — you’ll set your
      own on first sign in.
    </p>
  </form>
</app-auth-layout>
