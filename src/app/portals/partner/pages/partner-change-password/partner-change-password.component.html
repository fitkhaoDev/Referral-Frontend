<app-auth-layout
  eyebrow="Partner portal"
  [heading]="forced() ? 'Set your new password' : 'Change your password'"
  [subheading]="
    forced()
      ? 'Your temporary password must be replaced before you can continue.'
      : 'Choose a new password for your FitKhao account.'
  "
  tagline="Keep your account secure."
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    @if (forced()) {
      <app-alert tone="warning" title="Password change required">
        You’re signed in with a temporary password set by your administrator. Set your own password
        to access your dashboard.
      </app-alert>
    }
    @if (genericError(); as msg) {
      <app-alert tone="error" title="Could not update password">{{ msg }}</app-alert>
    }

    <app-text-field
      [control]="form.controls.currentPassword"
      label="Current / temporary password"
      type="password"
      autocomplete="current-password"
      requiredMark
    ></app-text-field>

    <app-text-field
      [control]="form.controls.newPassword"
      label="New password"
      type="password"
      autocomplete="new-password"
      hint="At least 8 characters, with an uppercase letter, a lowercase letter and a number."
      [errors]="{ weakPassword: 'Use ' + weakHint() + '.' }"
      requiredMark
    ></app-text-field>

    <app-text-field
      [control]="form.controls.confirmPassword"
      label="Confirm new password"
      type="password"
      autocomplete="new-password"
      [errors]="{ mismatch: 'Passwords do not match.' }"
      requiredMark
    ></app-text-field>

    <app-button type="submit" size="lg" block [loading]="busy()">
      {{ forced() ? 'Set password and continue' : 'Update password' }}
    </app-button>

    @if (!forced()) {
      <a routerLink="/partner/profile" class="back">Cancel</a>
    }
  </form>
</app-auth-layout>
