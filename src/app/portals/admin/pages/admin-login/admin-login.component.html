<app-auth-layout
  eyebrow="Admin portal"
  heading="Sign in to FitKhao"
  subheading="Manage referral partners, incentive rules, commissions and withdrawals."
  tagline="Referral Partner Management"
>
  <!-- Role selector tabs -->
  <div class="role-tabs" role="tablist">
    <button
      type="button"
      role="tab"
      class="role-tab role-tab--active"
      aria-selected="true"
    >Admin</button>
    <button
      type="button"
      role="tab"
      class="role-tab"
      aria-selected="false"
      (click)="goToPartner()"
    >Partner</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    @if (error(); as err) {
      <app-alert tone="error" title="Sign in failed">{{ err.message }}</app-alert>
    }

    <app-text-field
      [control]="form.controls.identifier"
      label="Email, mobile or user ID"
      autocomplete="username"
      placeholder="you@fitkhao.com, 98xxxxxxxx or your user ID"
      requiredMark
      [errors]="{ identifier: 'Enter a valid email, 10-digit mobile number or user ID.' }"
    ></app-text-field>

    <app-text-field
      [control]="form.controls.password"
      label="Password"
      type="password"
      autocomplete="current-password"
      requiredMark
    ></app-text-field>

    <app-button type="submit" size="lg" block [loading]="busy()">Sign in</app-button>
  </form>
</app-auth-layout>
