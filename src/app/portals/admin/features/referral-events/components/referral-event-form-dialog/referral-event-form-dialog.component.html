<app-dialog-shell
  [title]="isEdit ? 'Edit referral event' : 'New referral event'"
  [subtitle]="editing ? editing.code : 'Business event the incentive engine can react to'"
  (dismissed)="cancel()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
    @if (genericError(); as msg) {
      <app-alert tone="error" title="Could not save">{{ msg }}</app-alert>
    }
    @if (editing?.system) {
      <app-alert tone="info" title="System event">
        This event ships with the platform. You can rename it and change its order or status, but its
        code stays fixed.
      </app-alert>
    }

    <app-text-field
      [control]="form.controls.name"
      label="Name"
      placeholder="e.g. Subscription Renewed"
      requiredMark
    ></app-text-field>

    <app-text-field
      [control]="form.controls.code"
      label="Code"
      placeholder="e.g. SUBSCRIPTION_RENEWED"
      [hint]="
        isEdit
          ? 'The code cannot be changed after creation.'
          : 'UPPER_SNAKE_CASE. Incentive rules reference this — it is permanent.'
      "
      [errors]="{ pattern: 'Use uppercase letters, numbers and underscores, starting with a letter.' }"
      requiredMark
    ></app-text-field>

    <label class="field">
      <span class="field__label">Description</span>
      <textarea
        rows="3"
        formControlName="description"
        placeholder="Optional — when this event fires"
      ></textarea>
    </label>

    <app-text-field
      [control]="form.controls.sortOrder"
      label="Display order"
      type="number"
      inputmode="numeric"
      hint="Lower numbers appear first in pickers and timelines."
      [errors]="{ min: 'Must be 0 or more.', max: 'Must be 9999 or less.' }"
      requiredMark
    ></app-text-field>

    <app-switch-field
      [control]="form.controls.active"
      label="Status"
      onText="Active"
      offText="Inactive"
    ></app-switch-field>
  </form>

  <div footer>
    <app-button variant="secondary" (pressed)="cancel()">Cancel</app-button>
    <app-button [loading]="saving()" (pressed)="submit()">
      {{ isEdit ? 'Save changes' : 'Create referral event' }}
    </app-button>
  </div>
</app-dialog-shell>
