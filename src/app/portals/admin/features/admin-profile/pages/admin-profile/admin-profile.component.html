<section class="fk-page">
  <app-page-header title="Profile" subtitle="Your FitKhao Admin account.">
    <div actions>
      <app-button variant="secondary" (pressed)="signOut()">Sign out</app-button>
    </div>
  </app-page-header>

  <div class="grid">
    <section class="panel">
      <h2>Account</h2>
      <dl class="detail">
        <div><dt>Name</dt><dd>{{ user()?.displayName }}</dd></div>
        <div><dt>Email</dt><dd class="fk-num">{{ user()?.email }}</dd></div>
        <div><dt>Roles</dt><dd>{{ (user()?.roles || []).join(', ') || '—' }}</dd></div>
      </dl>

      <h3>Permissions</h3>
      @if (permissions().length) {
        <ul class="perms">
          @for (p of permissions(); track p) {
            <li><code>{{ p }}</code></li>
          }
        </ul>
      } @else {
        <p class="muted">No permissions on this account.</p>
      }
    </section>

  </div>
</section>
